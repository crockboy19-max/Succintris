<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Keep previous meta and styles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Mobile-optimized additions */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            touch-action: manipulation;
        }
        .control-btn {
            background: rgba(110, 69, 226, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            user-select: none;
        }
        @media (max-width: 600px) {
            .game-container {
                flex-direction: column;
                transform: scale(0.9);
            }
            #game-board {
                width: 250px;
                height: 500px;
            }
            .block {
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- Previous game elements -->
    <div class="controls">
        <div class="control-btn" id="left">←</div>
        <div class="control-btn" id="rotate">↻</div>
        <div class="control-btn" id="right">→</div>
        <div class="control-btn" id="down" style="grid-column: 1 / -1;">↓</div>
    </div>

    <script>
        // Touch controls
        const controls = {
            left: document.getElementById('left'),
            right: document.getElementById('right'),
            rotate: document.getElementById('rotate'),
            down: document.getElementById('down')
        };

        // Add both touch and click events
        Object.entries(controls).forEach(([action, element]) => {
            element.addEventListener('touchstart', handleControl);
            element.addEventListener('click', handleControl);
        });

        function handleControl(e) {
            e.preventDefault();
            const action = this.id;
            
            switch(action) {
                case 'left': currentBlock.x--; break;
                case 'right': currentBlock.x++; break;
                case 'rotate': 
                    const rotated = currentBlock.shape[0].map((_, i) =>
                        currentBlock.shape.map(row => row[i]).reverse()
                    );
                    if (!checkCollision(currentBlock.x, currentBlock.y, rotated)) 
                        currentBlock.shape = rotated;
                    break;
                case 'down': currentBlock.y++; break;
            }
            updateDisplay();
        }
    </script>
</body>
</html>
